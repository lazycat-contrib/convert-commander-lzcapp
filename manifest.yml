lzc-sdk-version: "0.1"
name: Convert Commander
package: cloud.lazycat.app.convert-commander
version: 1.2.1
description: The free software for converting files!
homepage: https://github.com/Benzauber/convert-commander
author: Benzauber
application:
  subdomain: convert-commander
  background_task: true
  public_path:
    - /
  routes:
    - /=http://convert-commander:5000

services:
  convert-commander:
    # docker.1ms.run/benzauber/convert-commander:v1.2.1
    image: registry.lazycat.cloud/czyt/benzauber/convert-commander:0789f2ab806472f4
    binds:
      - /lzcapp/var/uploads:/app/uploads
      - /lzcapp/var/convert:/app/convert
